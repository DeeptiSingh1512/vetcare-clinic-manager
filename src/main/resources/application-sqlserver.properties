spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:14330;databaseName=petclinic;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/sqlserver/schema.sql
spring.sql.init.data-locations=classpath*:db/sqlserver/data.sql